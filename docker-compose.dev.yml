# LOCAL DEVELOPMENT stack — the backing services only, NOT the app.
#
# `docker-compose.yml` runs the whole thing in production mode, which is what you want
# for self-hosting but not for working on the code: the app container is a production
# build, so there is no hot reload and the dev sign-in (DEV_LOGIN, see lib/auth.ts) is
# gated off. This file brings up Postgres + PostgREST + a mail catcher and leaves the
# app to `npm run dev` on the host.
#
#   cp .env.docker.example .env.docker
#   node scripts/docker/gen-keys.mjs >> .env.docker   # DB password + JWT secret + key
#   docker compose -f docker-compose.dev.yml up -d
#   # point .env.local at the exposed PostgREST + set DEV_LOGIN, then:
#   npm run dev            # http://localhost:3000 — sign in via /api/auth/signin
#
# Ports on the host: 3001 PostgREST · 1025 SMTP · 8025 Mailpit web UI.
#
# Postgres data lives in a NAMED DOCKER VOLUME, not a bind mount under the repo. The
# production compose bind-mounts ./data, which Docker creates root-owned — and eslint
# and Turbopack both walk the project tree and die on EACCES when they hit it. Keeping
# the dev database out of the tree entirely avoids the whole class of problem.
# Wipe it with: docker compose -f docker-compose.dev.yml down -v

name: quire-dev

services:
  db:
    image: postgres:16-alpine
    env_file: .env.docker
    environment:
      POSTGRES_DB: quire
      POSTGRES_USER: postgres
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
      - ./docker/initdb/01_roles.sql:/docker-entrypoint-initdb.d/01_roles.sql:ro
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
      - ./docker/initdb/03_grants.sql:/docker-entrypoint-initdb.d/03_grants.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d quire']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Exposed on the HOST (unlike the production compose, where only the app can reach
  # it) because the dev server runs outside Docker.
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.docker
    environment:
      PGRST_DB_URI: postgres://postgres@db:5432/quire
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
    ports:
      - '3001:3000'
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.docker
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: quire
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ['/bin/sh', '-c', 'PGPASSWORD="$$POSTGRES_PASSWORD" sh /scripts/migrate.sh']
    restart: 'no'

  # Mail catcher: accepts every message and shows it at http://localhost:8025 instead of
  # delivering it. Point Admin → Settings → Integrations at host `localhost`, port 1025,
  # TLS off, and the whole newsletter path (opt-in, broadcast, reply, test) can be
  # exercised end to end without a real SMTP account or a real inbox.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '1025:1025'
      - '8025:8025'
    restart: unless-stopped

volumes:
  dev-pgdata:
