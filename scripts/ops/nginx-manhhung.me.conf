# manhhung.me — Quire 2.0.
#
# The CSP is STRICTER than the one the frozen tree needed: no 'unsafe-inline' for scripts.
# 2.0 has no inline script anywhere and that property is tested, so the header can finally
# say so. If an inline script ever appears, this is what will refuse to run it.
#
# No X-Robots-Tag here. This is the site now; old.manhhung.me and next.manhhung.me carry
# the noindex between them.

server {
    listen 80; listen [::]:80;
    server_name manhhung.me www.manhhung.me;
    listen 443 ssl; listen [::]:443 ssl;
    ssl_certificate     /etc/nginx/ssl/manhhung.me.pem;
    ssl_certificate_key /etc/nginx/ssl/manhhung.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com https://www.tiktok.com https://challenges.cloudflare.com; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    client_max_body_size 64M;
    # The MCP OAuth consent screen. Approving it POSTs to this same path and the answer is a
    # 302 to the client's own callback (claude.ai, an editor, a CLI on localhost). Chrome
    # enforces form-action across the WHOLE redirect chain of a form submission, so under
    # "form-action 'self'" the Approve button did nothing at all, silently.
    #
    # Only form-action is relaxed, and only here. An add_header in a location REPLACES the
    # inherited ones rather than adding to them, which is why all five are repeated.
    location = /api/mcp/authorize {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https:; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
