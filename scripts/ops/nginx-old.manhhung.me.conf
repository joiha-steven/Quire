# old.manhhung.me — the frozen Next.js tree, kept reachable after the cutover.
#
# Same vhost the live site had, with two differences: the name, and noindex. It is an
# archive for comparison ("did we lose something?"), not a second copy of the blog for a
# search engine to find and rank against the real one.
#
# Its CSP keeps 'unsafe-inline' for scripts because Next needs it. The new stack does not,
# which is why manhhung.me gets a stricter one.

server {
    listen 80; listen [::]:80;
    server_name old.manhhung.me;
    listen 443 ssl; listen [::]:443 ssl;
    ssl_certificate     /etc/nginx/ssl/manhhung.me.pem;
    ssl_certificate_key /etc/nginx/ssl/manhhung.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    proxy_hide_header X-Powered-By;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com https://www.tiktok.com https://challenges.cloudflare.com; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    client_max_body_size 64M;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
